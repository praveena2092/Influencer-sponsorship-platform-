<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>








    <div class="d-flex flex-column flex-md-row p-4 gap-4 py-md-5 align-items-center justify-content-center">
        
      <form method="post" action="/update/campagin?s={{s}} ">

        <div class="dropdown-menu position-static d-flex flex-column flex-lg-row align-items-stretch justify-content-start p-3 rounded-3 shadow-lg" data-bs-theme="dark">
<h5>Update campaign details:</h5>
          <div class="d-none d-lg-block vr mx-4 opacity-10">&nbsp;</div>
          <hr class="d-lg-none">
          <div class="col-lg-auto pe-3">
            <nav>
              <ul class="d-flex flex-column gap-2 list-unstyled small">
                <a href="#" class="link-offset-2 link-underline link-underline-opacity-25 link-underline-opacity-75-hover">choice an campaign to update</a>
                    <select name="campaign_id">
                        {% for one in cam %}
                        <option value="{{one['campaign_id']}}">{{one['campaign_name']}}</option>
                        {% endfor %} 
                        
                    </select>
                <li><a href="#" class="link-offset-2 link-underline link-underline-opacity-25 link-underline-opacity-75-hover"><label>Update  Campaign_Name:</label><br>
                    <input type="text" name="campaign_name"/></a></li>
                    <li><a href="#" class="link-offset-2 link-underline link-underline-opacity-25 link-underline-opacity-75-hover"><label>Update  campaign_description:</label><br>
                        <input type="text" name="campaign_description"/></a></li>
                <li><a href="#" class="link-offset-2 link-underline link-underline-opacity-25 link-underline-opacity-75-hover"><label>Update  start_date:</label><br>
                    <input type="text" name="start_date"/></a></li>
                <li><a href="#" class="link-offset-2 link-underline link-underline-opacity-25 link-underline-opacity-75-hover"><label>Update  end_date:</label><br>
                    <input type="text" name="end_date"/></a></li>
                <li><a href="#" class="link-offset-2 link-underline link-underline-opacity-25 link-underline-opacity-75-hover"><label>Update  visibility:</label><br>
                    <input type="text" name="visibility"/></a></li>
                
                <li><a href="#" class="link-offset-2 link-underline link-underline-opacity-25 link-underline-opacity-75-hover"><label>Update  goals</label><br>
                    <input type="text" name="goals"/></a></li>
                <li><a href="#" class="link-offset-2 link-underline link-underline-opacity-25 link-underline-opacity-75-hover"><label>Update  campaign_budget</label><br>
                    <input type="integer" name="campaign_budget"/></a></li>
                    
                    <hr>
                    <P>By clicking submit you agree to the terms and condition</P>
                    <input name='update' type="submit"/>
                </form>
              </ul>
            </nav>
          </div>
        </div>
      </div>





    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
