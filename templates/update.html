<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    

    <form method="post" action="/update/profile/influencer?i={{i.influencer_id}} ">
    <div class="container col-xl-10 col-xxl-8 px-4 py-5">
        <div class="row align-items-center g-lg-5 py-5">
          <div class="col-lg-7 text-center text-lg-start">
            <h1 class="display-4 fw-bold lh-1 text-body-emphasis mb-3">Update Profile</h1>
            <p class="col-lg-10 fs-4">Whether you're looking to refresh your profile, highlight recent achievements, or better connect with your audience, our profile update service is here to help you shine.</p>
          </div>
          <div class="col-md-10 mx-auto col-lg-5">
            <form class="p-4 p-md-5 border rounded-3 bg-body-tertiary">
              <div class="form-floating mb-3">
                <input type="text" name="niche" class="form-control" id="floatingInput" placeholder="name@example.com">
                <label for="floatingInput">Update Niche</label>
              </div>
              <div class="form-floating mb-3">
                <input type="text" name="category" class="form-control" id="floatingPassword" placeholder="Password">
                <label for="floatingPassword">Update Category</label>
              </div>
              <div class="form-floating mb-3">
                <input type="text" name="reach" class="form-control" id="floatingPassword" placeholder="Password">
                <label for="floatingPassword">Update Reach</label>
              </div>
              
              <button class="w-100 btn btn-lg btn-primary" type="submit">Update</button>
              <hr class="my-4">
              <small class="text-body-secondary">By clicking update, you agree to the terms of use.</small>
            </form>
          </div>
        </div>
      </div>










    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
