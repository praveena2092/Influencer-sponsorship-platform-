<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<h1>Influencer Sign Up Page</h1>
<p>Welcome to influencer page of Spin</p>

<hr>

  <div class="d-flex flex-column flex-md-row p-4 gap-4 py-md-5 align-items-center justify-content-center grid-container">
        
      
    <hr>
    <form method="post" action="/create/influencer">
      <div class="dropdown-menu d-block position-static border-0 pt-0 mx-0 rounded-3 shadow overflow-hidden w-280px  grid-container" data-bs-theme="dark">
        <p class="p-2 mb-2 bg-dark border-bottom border-dark">
          <input type="search" class="form-control bg-dark" autocomplete="false" placeholder="Sign Up...">
        </p>
        <ul class="list-unstyled mb-0">

          <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="#">
            <span class="d-inline-block bg-danger rounded-circle p-1"></span>
            <div class="grid-item">
              <label>Enter a Influencer Name: </label><br>
            
              <input  name="i_name" type="text" required />
          </div>
          </a>
          <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="#">
            <span class="d-inline-block bg-danger rounded-circle p-1"></span>
            <div>
              <label>Enter a Influencer Category </label><br>
              <input  name="i_category" type="text"  />
          </div>
          </a>
          <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="#">
            <span class="d-inline-block bg-danger rounded-circle p-1"></span>
            <div class="grid-item">
              <label>Enter a Influencer Niche </label><br>
              <input  name="i_niche" type="text"  />
          </div>
          </a>
          <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="#">
            <span class="d-inline-block bg-danger rounded-circle p-1"></span>
            <div class="grid-item">
              <label>Enter a Influencer Reach :  </label><br>
              <input  name="i_reach" type="integer"  /><br/>
      </div>
   
          </a>
          <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="#">
              <span class="d-inline-block bg-danger rounded-circle p-1"></span>
              <div class="grid-item">
                <label>Enter a Influencer Password </label><br>
                <input  name="i_password" type="password"  required/><br/>
    </div>
            </a>
            <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="#">
              <span class="d-inline-block bg-danger rounded-circle p-1"></span>
              <p>By clicking , you agree to the terms of use.</p><br>
              <input  name="Add Sponsor" type="submit"  />
            </a>
        </ul>
      </div>
    </div>

  </form>

























































    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
