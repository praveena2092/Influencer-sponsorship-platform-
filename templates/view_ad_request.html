<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/s2.css"
</head>
<body>
    
   
   

    <main class="container">
       
      
        <div class="my-3 p-3 bg-body rounded shadow-sm gradient-background">
          <h3 class="border-bottom pb-2 mb-0">Ad_request updates</h3>
          {% for one in all %}
          <div class="d-flex text-body-secondary pt-3">
            <svg class="bd-placeholder-img flex-shrink-0 me-2 rounded" width="32" height="32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder: 32x32" preserveAspectRatio="xMidYMid slice" focusable="false"><title>Placeholder</title><rect width="100%" height="100%" fill="#007bff"></rect><text x="50%" y="50%" fill="#007bff" dy=".3em">32x32</text></svg>
            <p class="pb-3 mb-0 small lh-sm border-bottom">
              <strong class="d-block text-gray-dark">@{{one['campaign_id']}}</strong>
              message : {{one['message']}}<br/>
              requirements : {{one['requirements']}}<br/>
              payment_amount : {{one['payment_amount']}}<br/>
              status : {{one['status']}}<br/>
              
              
              
            </p>
          </div>
          {% endfor %}
          
          <small class="d-block text-end mt-3">
            <a href="./index.html">Go back</a>
          </small>
        </div>
      
        
      </main>







    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
