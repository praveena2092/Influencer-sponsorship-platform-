<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>


























































  <form method="post" action="/ad/request?s={{sponsor_id}}">
  <div class="dropdown-menu d-block position-static border-0 pt-0 mx-0 rounded-3 shadow overflow-hidden w-280px  grid-container" data-bs-theme="dark">
    <form class="p-2 mb-2 bg-dark border-bottom border-dark">
      <input type="search" class="form-control bg-dark" autocomplete="false" placeholder="Create Ad_request...">
    </form>
    <ul class="list-unstyled mb-0">

      <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="#">
        <span class="d-inline-block bg-success rounded-circle p-1"></span>
        <div class="grid-item">
          <label>choice an influencers</label><br>
          <select name="influencer_id">
              {% for one in all %}
              <option value="{{one['influencer_id']}}">{{one['influencer_name']}}</option>
              {% endfor %} 
              
          </select>
      </div>
      </a>
      <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="#">
        <span class="d-inline-block bg-primary rounded-circle p-1"></span>
        <div>
          <label>choice an campaign</label><br>
          <select name="campaign_id">
              {% for one in cam %}
              <option value="{{one['campaign_id']}}">{{one['campaign_name']}}</option>
              {% endfor %} 
              
          </select>
      </div>
      </a>
      <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="#">
        <span class="d-inline-block bg-danger rounded-circle p-1"></span>
        <div class="grid-item">
          <label>Enter the message</label><br>
          <input type="text" name="message"/><br/>
      </div>
      </a>
      <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="#">
        <span class="d-inline-block bg-info rounded-circle p-1"></span>
        <div class="grid-item">
          <label>Enter the requirements</label><br>
          <input type="text" name="requirements"/><br/>
  </div>

      </a>
      <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="#">
          <span class="d-inline-block bg-info rounded-circle p-1"></span>
          <div class="grid-item">
            <label>Enter the payment_amount</label><br>
            <input type="integer" name="payment_amount"/><br/>
</div>
        </a>
        <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="#">
          <span class="d-inline-block bg-info rounded-circle p-1"></span>
          <div class="grid-item">
          <label>Enter the status</label><br>
        <input type="text" name="status"/><br/>
      </div>
        </a>
        <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="#">
          <span class="d-inline-block bg-success rounded-circle p-1"></span>
          <div class="grid-item">
            By clicking submit you agree to the term and condition
            <input  name="Add Sponsor" type="submit"  />

        </div>
        </a>
    </ul>
  </div>
</div>

</form>

































   














    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
